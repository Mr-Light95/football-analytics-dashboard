<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Analytics Dashboard</title>

    <!-- AmCharts CDN -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <style>
        /* ========== ENHANCED GLOBAL STYLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1419 100%);
            color: #e0e0e0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

            /* Stadium texture overlay */
            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: repeating-linear-gradient( 0deg, transparent, transparent 50px, rgba(0, 255, 136, 0.03) 50px, rgba(0, 255, 136, 0.03) 100px );
                pointer-events: none;
                z-index: 1;
            }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* ========== ENHANCED HEADER ========== */
        .header {
            background: linear-gradient(135deg, #1e2745 0%, #2a3254 100%);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.15);
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            position: relative;
            overflow: hidden;
        }

            .header::before {
                content: '⚽';
                position: absolute;
                right: 30px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 80px;
                opacity: 0.1;
            }

            .header h1 {
                font-size: 2.5em;
                color: #00ff88;
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
                margin-bottom: 10px;
                letter-spacing: 2px;
            }

            .header p {
                color: #a0a0a0;
                font-size: 1.1em;
            }

        /* ========== FILTERS SECTION ========== */
        .filters {
            background: linear-gradient(135deg, #1e2745 0%, #2a3254 100%);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

            .filters select {
                padding: 10px 15px;
                border: 2px solid #00ff88;
                border-radius: 8px;
                font-size: 14px;
                cursor: pointer;
                background: #1a1f3a;
                color: #e0e0e0;
                transition: all 0.3s ease;
            }

                .filters select:hover {
                    border-color: #00d4ff;
                    box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
                }

            .filters button {
                padding: 10px 20px;
                background: linear-gradient(135deg, #00ff88, #00d4ff);
                color: #0a0e27;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                transition: all 0.3s ease;
            }

                .filters button:hover {
                    transform: scale(1.05);
                    box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
                }

        /* ========== ENHANCED STATS CARDS (KPI) ========== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: linear-gradient(135deg, #252d48 0%, #1e2438 100%);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

            .kpi-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 3px;
                background: linear-gradient(90deg, #00ff88, #00d4ff);
            }

            .kpi-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
                border-color: #00ff88;
            }

            .kpi-card h3 {
                color: #00ff88;
                font-size: 0.9em;
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 10px;
                font-weight: 500;
            }

            .kpi-card .value {
                font-size: 2.5em;
                font-weight: bold;
                color: #ffffff;
                text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            }

        /* ========== FIFA-STYLE PLAYER CARDS ========== */
        .players-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 2em;
            color: #00ff88;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            border-bottom: 2px solid rgba(0, 255, 136, 0.3);
            padding-bottom: 10px;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* FIFA-Style Player Card */
        .player-card {
            background: linear-gradient(135deg, #1a2332 0%, #2d3748 100%);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

            /* Shine effect overlay */
            .player-card::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: linear-gradient( 45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70% );
                transform: rotate(45deg);
                transition: all 0.6s;
            }

            .player-card:hover::before {
                left: 100%;
            }

            .player-card:hover {
                transform: translateY(-15px) scale(1.05);
                box-shadow: 0 20px 40px rgba(0, 255, 136, 0.4), 0 0 30px rgba(0, 255, 136, 0.2);
                border-color: #00ff88;
            }

        /* Player card header with position badge */
        .player-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .position-badge {
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            color: #0a0e27;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0, 255, 136, 0.3);
        }

        .rank-badge {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            border: 1px solid #ffd700;
        }

        /* Player photo container */
        .player-photo {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            position: relative;
        }

            .player-photo img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.3s ease;
            }

        .player-card:hover .player-photo img {
            transform: scale(1.1);
        }

        /* Player info */
        .player-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .player-branch {
            text-align: center;
            color: #00d4ff;
            font-size: 0.9em;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        /* Player stats grid */
        .player-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 255, 136, 0.2);
        }

        .player-stat {
            text-align: center;
        }

        .player-stat-label {
            font-size: 0.75em;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .player-stat-value {
            font-size: 1.1em;
            color: #00ff88;
            font-weight: bold;
            margin-top: 3px;
        }

        /* ========== HAALAND ANIMATION OVERLAY ========== */
        #haaland-animation {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

            #haaland-animation.active {
                display: flex;
            }

        .haaland-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
        }

        /* Sliding Haaland animation */
        .haaland-player {
            position: absolute;
            left: -300px;
            bottom: 20%;
            width: 250px;
            height: 300px;
            animation: slideIn 1.5s ease-out forwards;
            z-index: 5;
        }

        @keyframes slideIn {
            0% {
                left: -300px;
                opacity: 0;
            }

            100% {
                left: 20%;
                opacity: 1;
            }
        }

        .haaland-player img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            filter: drop-shadow(0 0 30px rgba(0, 255, 136, 0.8));
            border: 3px solid #00ff88;
        }

        /* Football shooting animation */
        .football {
            position: absolute;
            left: 35%;
            bottom: 25%;
            width: 60px;
            height: 60px;
            font-size: 60px;
            animation: shootBall 2s ease-in-out 1.5s forwards;
            opacity: 0;
            z-index: 10;
        }

        @keyframes shootBall {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }

            30% {
                transform: translate(150px, -100px) rotate(360deg) scale(1.1);
            }

            60% {
                transform: translate(300px, -150px) rotate(720deg) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translate(500px, -80px) rotate(1440deg) scale(0.5);
            }
        }

        /* Goal net effect */
        .goal-effect {
            position: absolute;
            right: 10%;
            top: 20%;
            font-size: 120px;
            opacity: 0;
            animation: goalFlash 1s ease-out 3.5s forwards;
            z-index: 15;
        }

        @keyframes goalFlash {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }

            25% {
                opacity: 1;
                transform: scale(1.3) rotate(5deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                opacity: 0;
                transform: scale(1.5) rotate(0deg);
            }
        }

        .close-animation {
            position: absolute;
            top: 30px;
            right: 30px;
            background: #00ff88;
            color: #0a0e27;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

            .close-animation:hover {
                background: #00d4ff;
                transform: scale(1.1);
            }

        /* ========== GENERIC PLAYER ANIMATION ========== */
        .player-card.animated {
            animation: playerPulse 0.6s ease-in-out;
        }

        @keyframes playerPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
                box-shadow: 0 0 40px rgba(0, 255, 136, 0.8);
            }
        }

        /* ========== CHARTS SECTION ========== */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: linear-gradient(135deg, #1e2745 0%, #2a3254 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

            .chart-card h3 {
                font-size: 1.3em;
                color: #00ff88;
                margin-bottom: 20px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

        .chart {
            width: 100%;
            height: 400px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        /* ========== RESPONSIVE DESIGN ========== */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .players-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ENHANCED HEADER -->
        <div class="header">
            <h1>⚽ Premier League Club Dashboard</h1>
            <p>Performance Analytics & Business Intelligence</p>
        </div>

        <!-- FILTERS -->
        <div class="filters">
            <select id="branchFilter">
                <option value="all">All Branches</option>
            </select>
            <select id="rankFilter">
                <option value="all">All Ranks</option>
            </select>
            <button onclick="refreshData()">Refresh</button>
        </div>

        <!-- KPI CARDS -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <h3>Total Players</h3>
                <div class="value" id="kpi-players">-</div>
            </div>
            <div class="kpi-card">
                <h3>Total Games</h3>
                <div class="value" id="kpi-games">-</div>
            </div>
            <div class="kpi-card">
                <h3>Total Income</h3>
                <div class="value" id="kpi-income">-</div>
            </div>
            <div class="kpi-card">
                <h3>Win Rate</h3>
                <div class="value" id="kpi-winrate">-</div>
            </div>
        </div>

        <!-- CHARTS -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>💰 Income by Branch</h3>
                <div id="chart1" class="chart"></div>
            </div>

            <div class="chart-card">
                <h3>👥 Players by Position</h3>
                <div id="chart2" class="chart"></div>
            </div>

            <div class="chart-card">
                <h3>🏆 Players by Rank</h3>
                <div id="chart3" class="chart"></div>
            </div>

            <div class="chart-card">
                <h3>📊 Income by Type</h3>
                <div id="chart4" class="chart"></div>
            </div>

            <div class="chart-card full-width">
                <h3>⭐ Top 10 Players by Salary</h3>
                <div id="chart5" class="chart"></div>
            </div>

            <!-- FIFA-STYLE PLAYERS SECTION -->
            <div class="chart-card full-width">
                <h3>🧍‍♂️ Squad Players</h3>
                <div id="playersGrid" class="players-grid"></div>
            </div>
        </div>
    </div>

    <!-- HAALAND SPECIAL ANIMATION OVERLAY -->
    <div id="haaland-animation">
        <button class="close-animation" onclick="closeHaalandAnimation()">✕ Close</button>
        <div class="haaland-container">
            <!-- Sliding player with photo from database -->
            <div class="haaland-player">
                <img src="https://via.placeholder.com/250x300/1a2332/00ff88?text=PLAYER" alt="Player">
            </div>
            <!-- Animated football -->
            <div class="football">⚽</div>
            <!-- Goal effect -->
            <div class="goal-effect">🥅💥</div>
            <!-- Player name display -->
            <div style="position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); color: #00ff88; font-size: 3em; font-weight: bold; text-shadow: 0 0 30px rgba(0, 255, 136, 0.8); text-transform: uppercase; letter-spacing: 3px; opacity: 0; animation: fadeInName 0.5s ease-out 0.5s forwards;">
                GOAL!
            </div>
        </div>
    </div>

    <style>
        /* Fade in animation for goal text */
        @keyframes fadeInName {
            from {
                opacity: 0;
                transform: translateX(-50%) scale(0.5);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }
    </style>

    <script>
        // ========== API CONFIGURATION ==========
        const API_URL = 'http://localhost:5000/api';

        // Global charts storage
        let charts = {};

        // ========== INITIALIZE DASHBOARD ==========
        async function initDashboard() {
            await loadFilters();
            await loadData();
        }

        // ========== LOAD FILTER OPTIONS ==========
        async function loadFilters() {
            try {
                // Load branches
                const branchesRes = await fetch(`${API_URL}/branches`);
                const branches = await branchesRes.json();

                const branchFilter = document.getElementById('branchFilter');
                branches.forEach(branch => {
                    const option = document.createElement('option');
                    option.value = branch.BranchID;
                    option.textContent = branch.BranchName;
                    branchFilter.appendChild(option);
                });

                // Load ranks
                const ranksRes = await fetch(`${API_URL}/ranks`);
                const ranks = await ranksRes.json();

                const rankFilter = document.getElementById('rankFilter');
                ranks.forEach(rank => {
                    const option = document.createElement('option');
                    option.value = rank.RankID;
                    option.textContent = rank.RankName;
                    rankFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading filters:', error);
            }
        }

        // ========== LOAD ALL DATA AND CREATE CHARTS ==========
        async function loadData() {
            try {
                // Get filter values
                const branchId = document.getElementById('branchFilter').value;
                const rankId = document.getElementById('rankFilter').value;

                // Build query parameters
                let params = new URLSearchParams();
                if (branchId !== 'all') params.append('branchId', branchId);
                if (rankId !== 'all') params.append('rankId', rankId);

                // Fetch all data in parallel
                const [stats, incomeByBranch, playersByPosition, playersByRank, topPlayers, players] = await Promise.all([
                    fetch(`${API_URL}/stats/summary?${params}`).then(r => r.json()),
                    fetch(`${API_URL}/analytics/income-by-branch?${params}`).then(r => r.json()),
                    fetch(`${API_URL}/analytics/players-by-position?${params}`).then(r => r.json()),
                    fetch(`${API_URL}/analytics/players-by-rank?${params}`).then(r => r.json()),
                    fetch(`${API_URL}/analytics/top-players?limit=10&${params}`).then(r => r.json()),
                    fetch(`${API_URL}/players?${params}`).then(r => r.json())
                ]);

                // Update KPIs
                document.getElementById('kpi-players').textContent = stats.totalPlayers;
                document.getElementById('kpi-games').textContent = stats.totalGames;
                document.getElementById('kpi-income').textContent = '£' + (stats.totalIncome / 1000000).toFixed(1) + 'M';
                document.getElementById('kpi-winrate').textContent = stats.winRate.toFixed(1) + '%';

                // Create charts
                createColumnChart('chart1', incomeByBranch.map(d => ({
                    category: d.BranchName,
                    value: d.TotalIncome / 1000000
                })), 'BranchName', 'Income (£M)');

                createPieChart('chart2', playersByPosition.map(d => ({
                    category: d.Position,
                    value: d.Count
                })));

                createBarChart('chart3', playersByRank.map(d => ({
                    category: d.RankName,
                    value: d.Count
                })));

                // Income by type
                const incomeRes = await fetch(`${API_URL}/incomes?${params}`);
                const incomes = await incomeRes.json();
                const incomeByType = {};
                incomes.forEach(inc => {
                    incomeByType[inc.IncomeType] = (incomeByType[inc.IncomeType] || 0) + inc.Amount;
                });

                createColumnChart('chart4', Object.entries(incomeByType).map(([type, amount]) => ({
                    category: type,
                    value: amount / 1000000
                })), 'Type', 'Income (£M)');

                createBarChart('chart5', topPlayers.map(p => ({
                    category: p.PlayerName,
                    value: p.Salary / 1000000
                })), 'Salary (£M)');

                // Load FIFA-style player cards
                loadPlayers(players);

            } catch (error) {
                console.error('Error loading data:', error);
                alert('Error loading data. Please ensure the backend server is running.');
            }
        }

        // ========== LOAD FIFA-STYLE PLAYER CARDS ==========
        function loadPlayers(players) {
            const playersGrid = document.getElementById('playersGrid');
            playersGrid.innerHTML = '';

            if (!players || players.length === 0) {
                playersGrid.innerHTML = '<p style="color: #a0a0a0;">No players found</p>';
                return;
            }

            players.forEach(player => {
                const card = createPlayerCard(player);
                playersGrid.appendChild(card);
            });
        }

        // ========== CREATE FIFA-STYLE PLAYER CARD ==========
        function createPlayerCard(player) {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.onclick = () => handlePlayerClick(player);

            // Extract initials for fallback image
            const initials = player.PlayerName ? player.PlayerName.split(' ').map(n => n[0]).join('').substring(0, 2) : '??';

            card.innerHTML = `
                        <div class="player-card-header">
                            <div class="position-badge">${player.Position || 'N/A'}</div>
                            <div class="rank-badge">${player.RankName || 'Standard'}</div>
                        </div>

                        <div class="player-photo">
                            <img src="${player.PhotoUrl || 'https://via.placeholder.com/120/1a2332/00ff88?text=' + initials}"
                                 alt="${player.PlayerName}"
                                 onerror="this.src='https://via.placeholder.com/120/1a2332/00ff88?text=${initials}'">
                        </div>

                        <div class="player-name">${player.PlayerName || 'Unknown Player'}</div>
                        <div class="player-branch">${player.BranchName || 'Free Agent'}</div>

                        <div class="player-stats">
                            <div class="player-stat">
                                <div class="player-stat-label">Age</div>
                                <div class="player-stat-value">${player.Age || 'N/A'}</div>
                            </div>
                            <div class="player-stat">
                                <div class="player-stat-label">Salary</div>
                                <div class="player-stat-value">£${player.Salary ? (player.Salary / 1000000).toFixed(1) : '0'}M</div>
                            </div>
                        </div>
                    `;

            return card;
        }

        // ========== PLAYER CLICK ANIMATIONS ==========
        function handlePlayerClick(player) {
            console.log('Player clicked:', player);

            // Special animation for Erling Haaland
            if (player.PlayerName && player.PlayerName.toLowerCase().includes('haaland')) {
                showHaalandAnimation(player);
            } else {
                // Generic pulse animation for other players
                const cards = document.querySelectorAll('.player-card');
                cards.forEach(card => {
                    const nameElement = card.querySelector('.player-name');
                    if (nameElement && nameElement.textContent === player.PlayerName) {
                        card.classList.add('animated');
                        setTimeout(() => card.classList.remove('animated'), 600);
                    }
                });
            }
        }

        // ========== HAALAND SPECIAL ANIMATION ==========
        function showHaalandAnimation(player) {
            const overlay = document.getElementById('haaland-animation');

            // Update the image with actual player photo
            const haalandImg = overlay.querySelector('.haaland-player img');
            if (player.PhotoUrl) {
                haalandImg.src = player.PhotoUrl;
                haalandImg.alt = player.PlayerName;
            } else {
                // Fallback to placeholder with player initials
                const initials = player.PlayerName.split(' ').map(n => n[0]).join('').substring(0, 2);
                haalandImg.src = `https://via.placeholder.com/250x300/1a2332/00ff88?text=${initials}`;
            }

            overlay.classList.add('active');

            // Auto-close after animation completes (5 seconds)
            setTimeout(() => {
                closeHaalandAnimation();
            }, 5000);
        }

        function closeHaalandAnimation() {
            const overlay = document.getElementById('haaland-animation');
            overlay.classList.remove('active');

            // Reset animation by removing and re-adding the active class
            // This allows the animation to replay if clicked again
            setTimeout(() => {
                const haalandPlayer = overlay.querySelector('.haaland-player');
                const football = overlay.querySelector('.football');
                const goalEffect = overlay.querySelector('.goal-effect');

                // Force reflow to restart animations
                haalandPlayer.style.animation = 'none';
                football.style.animation = 'none';
                goalEffect.style.animation = 'none';

                setTimeout(() => {
                    haalandPlayer.style.animation = '';
                    football.style.animation = '';
                    goalEffect.style.animation = '';
                }, 10);
            }, 300);
        }

        // ========== CREATE COLUMN CHART (AmCharts 5) ==========
        function createColumnChart(chartId, data, categoryField, valueLabel) {
            // Dispose existing chart if any
            if (charts[chartId]) {
                charts[chartId].dispose();
            }

            // Create root
            let root = am5.Root.new(chartId);

            // Set themes
            root.setThemes([am5themes_Animated.new(root)]);

            // Create chart
            let chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false,
                panY: false,
                wheelX: "none",
                wheelY: "none"
            }));

            // Create axes
            let xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "category",
                renderer: am5xy.AxisRendererX.new(root, {
                    minGridDistance: 30
                })
            }));

            xAxis.data.setAll(data);

            let yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                renderer: am5xy.AxisRendererY.new(root, {})
            }));

            // Create series with FIFA-style colors
            let series = chart.series.push(am5xy.ColumnSeries.new(root, {
                name: valueLabel,
                xAxis: xAxis,
                yAxis: yAxis,
                valueYField: "value",
                categoryXField: "category",
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{categoryX}: {valueY}"
                })
            }));

            // Style columns with gradient
            series.columns.template.setAll({
                cornerRadiusTL: 5,
                cornerRadiusTR: 5,
                strokeOpacity: 0,
                fill: am5.color(0x00ff88),
                fillOpacity: 0.8
            });

            series.data.setAll(data);

            // Add cursor
            chart.set("cursor", am5xy.XYCursor.new(root, {}));

            charts[chartId] = root;
        }

        // ========== CREATE PIE CHART (AmCharts 5) ==========
        function createPieChart(chartId, data) {
            if (charts[chartId]) {
                charts[chartId].dispose();
            }

            let root = am5.Root.new(chartId);
            root.setThemes([am5themes_Animated.new(root)]);

            let chart = root.container.children.push(am5percent.PieChart.new(root, {
                layout: root.verticalLayout
            }));

            let series = chart.series.push(am5percent.PieSeries.new(root, {
                valueField: "value",
                categoryField: "category"
            }));

            // Custom colors for FIFA theme
            series.get("colors").set("colors", [
                am5.color(0x00ff88),
                am5.color(0x00d4ff),
                am5.color(0x667eea),
                am5.color(0xffd700),
                am5.color(0xff6b6b)
            ]);

            series.data.setAll(data);

            series.labels.template.setAll({
                text: "{category}: {value}",
                fontSize: 12,
                fill: am5.color(0xe0e0e0)
            });

            let legend = chart.children.push(am5.Legend.new(root, {
                centerX: am5.percent(50),
                x: am5.percent(50),
                layout: root.horizontalLayout
            }));

            legend.labels.template.setAll({
                fill: am5.color(0xe0e0e0)
            });

            legend.data.setAll(series.dataItems);

            charts[chartId] = root;
        }

        // ========== CREATE BAR CHART (AmCharts 5) ==========
        function createBarChart(chartId, data, valueLabel) {
            if (charts[chartId]) {
                charts[chartId].dispose();
            }

            let root = am5.Root.new(chartId);
            root.setThemes([am5themes_Animated.new(root)]);

            let chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false,
                panY: false,
                wheelX: "none",
                wheelY: "none",
                layout: root.verticalLayout
            }));

            let yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "category",
                renderer: am5xy.AxisRendererY.new(root, {
                    inversed: true,
                    cellStartLocation: 0.1,
                    cellEndLocation: 0.9
                })
            }));

            yAxis.data.setAll(data);

            let xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, {
                renderer: am5xy.AxisRendererX.new(root, {})
            }));

            let series = chart.series.push(am5xy.ColumnSeries.new(root, {
                name: valueLabel || "Value",
                xAxis: xAxis,
                yAxis: yAxis,
                valueXField: "value",
                categoryYField: "category",
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{categoryY}: {valueX}"
                })
            }));

            series.columns.template.setAll({
                cornerRadiusTR: 5,
                cornerRadiusBR: 5,
                strokeOpacity: 0,
                fill: am5.color(0x00ff88),
                fillOpacity: 0.8
            });

            series.data.setAll(data);

            charts[chartId] = root;
        }

        // ========== REFRESH DATA ==========
        function refreshData() {
            loadData();
        }

        // Event listeners for filters
        document.getElementById('branchFilter').addEventListener('change', refreshData);
        document.getElementById('rankFilter').addEventListener('change', refreshData);

        // Initialize dashboard on page load
        initDashboard();
    </script>
